[package]
license.workspace = true
publish = false
name = "xiom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "xiom"
path = "src/lib.rs"

[[bin]]
name = "xiom"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
xiom-lexer = { path = "../xiom-lexer" }
xiom-parser = { path = "../xiom-parser" }
xiom-ast = { path = "../xiom-ast" }
xiom-lowering = { path = "../xiom-lowering" }
xiom-check = { path = "../xiom-check" }
xiom-codegen = { path = "../xiom-codegen" }
xiom-verify = { path = "../xiom-verify" }
xiom-graph = { path = "../xiom-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
libloading = "0.8"
xiom-jit = { path = "../xiom-jit" }

[features]
default = []
nasm = []  # Enable NASM assembly of .asm files for hardware acceleration
full-e2e = []  # Enable full compile+run execution tests (requires runtime linking)
