[package]
name = "xiom-wasm"
version = "0.58.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
xiom-lexer = { path = "../xiom-lexer" }
xiom-parser = { path = "../xiom-parser" }
xiom-check = { path = "../xiom-check" }
xiom-codegen = { path = "../xiom-codegen" }
xiom-ast = { path = "../xiom-ast" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }