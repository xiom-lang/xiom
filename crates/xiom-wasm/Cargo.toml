[package]
license.workspace = true
publish = false
name = "xiom-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
xiom-lexer = { path = "../xiom-lexer" }
xiom-parser = { path = "../xiom-parser" }
xiom-check = { path = "../xiom-check" }
xiom-codegen = { path = "../xiom-codegen" }
xiom-ast = { path = "../xiom-ast" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
