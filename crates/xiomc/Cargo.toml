[package]
name = "xiomc"
version = "0.47.4"
edition = "2024"

[lib]
name = "xiomc"
path = "src/lib.rs"

[[bin]]
name = "xiomc"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
xiom-lexer = { path = "../xiom-lexer" }
xiom-parser = { path = "../xiom-parser" }
xiom-ast = { path = "../xiom-ast" }
xiom-check = { path = "../xiom-check" }
xiom-codegen = { path = "../xiom-codegen" }
xiom-verify = { path = "../xiom-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
nasm = []  # Enable NASM assembly of .asm files for hardware acceleration
