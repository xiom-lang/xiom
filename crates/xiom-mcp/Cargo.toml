[package]
name = "xiom-mcp"
version = "0.1.0"
edition = "2024"
description = "XIOM Model Context Protocol server — AI agent tool-calling API"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xiom = { path = "../xiom" }
xiom-graph = { path = "../xiom-graph" }
xiom-ast = { path = "../xiom-ast" }
xiom-lexer = { path = "../xiom-lexer" }
xiom-parser = { path = "../xiom-parser" }
