# cargo-deny configuration -- XIOM workspace supply-chain gate (Stage 5).
#
# CI runs: cargo deny check advisories licenses bans sources
# Local:   cargo install cargo-deny && cargo deny check
#
# The allow-list is deliberately explicit: a new dependency with a license
# outside it fails the gate until a human adds it here. MIT/Apache-2.0 is
# the project license (see [workspace.package] in Cargo.toml).

[advisories]
# RUSTSEC-2024-0384: `instant` is unmaintained (no vulnerability reported, no
# safe upgrade available). Pulled in by notify 7 -> notify-types -> xiom-jit.
# Remove this ignore when the JIT watcher moves to notify 8 or a maintained
# replacement.
ignore = ["RUSTSEC-2024-0384"]

[licenses]
# Permissive licenses present in the current dependency tree, plus the
# LLVM exception used by some Rust toolchain-adjacent crates and the Mozilla
# CA root-store data license (webpki-roots, pulled by ureq/rustls).
# CDLA-Permissive-2.0 covers DATA (certificate roots), not code.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Duplicate major versions are a warning (reviewed during dependency bumps);
# wildcard dependencies are always rejected -- EXCEPT workspace-local path
# dependencies, which intentionally omit version specifiers.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
