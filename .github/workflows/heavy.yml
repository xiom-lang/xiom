name: XIOM Heavy Suites

# Tier 2: fuzz smoke + sanitizer wiring, weekly and on demand. Kept out of
# the PR workflow to protect private-repo minutes.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Audit gap: "toy LCG fuzzers; no coverage/ASAN/fuzz CI gates". The fuzz/
  # directory is a standalone cargo-fuzz workspace (libfuzzer-sys is kept out
  # of the root workspace on purpose). Linux links Rust's ASAN statically, so
  # the coverage runs below carry address+undefined instrumentation.
  fuzz-smoke:
    name: fuzz smoke (cargo-fuzz, 30s/target, ASAN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Fuzz lexer
        run: cargo +nightly fuzz run lexer -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz parser
        run: cargo +nightly fuzz run parser -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz ctfe
        run: cargo +nightly fuzz run ctfe -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz pipeline
        run: cargo +nightly fuzz run pipeline -- -max_total_time=30 -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Compiler-side sanitizer wiring (`--sanitize=address`) must actually
  # produce a runnable, clean-boot instrumented binary.
  sanitizer-smoke:
    name: sanitizer smoke (--sanitize=address)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build compiler
        run: cargo build -p xiom

      - name: Compile + run an ASAN-instrumented program
        run: |
          cat > /tmp/asan_smoke.xi <<'EOF'
          fn sieve(n: Int) -> Int {
            var count = 0;
            var i = 2;
            while i < n {
              var is_prime = true;
              var d = 2;
              while d * d <= i {
                if i - (i / d) * d == 0 { is_prime = false; }
                d = d + 1;
              }
              if is_prime { count = count + 1; }
              i = i + 1;
            }
            return count;
          }
          fn main() -> Int {
            if sieve(50) != 15 { return 1; }
            return 0;
          }
          EOF
          target/debug/xiom /tmp/asan_smoke.xi --sanitize=address -o /tmp/asan_smoke
          ASAN_OPTIONS=detect_leaks=0 /tmp/asan_smoke
        shell: bash

      - name: Contracts under ASAN (runtime checker path)
        run: |
          cat > /tmp/asan_contract.xi <<'EOF'
          fn inc(n: Int) -> Int
            requires: n >= 0
            ensures: result == n + 1
          {
            return n + 1;
          }
          fn main() -> Int {
            return inc(41) - 42;
          }
          EOF
          target/debug/xiom /tmp/asan_contract.xi --sanitize=address -o /tmp/asan_contract
          ASAN_OPTIONS=detect_leaks=0 /tmp/asan_contract
        shell: bash
