name: XIOM Release

# Tag push (v*) publishes a GitHub Release with packaged toolchains.
# Manual dispatch builds the same packages as workflow artifacts (dry run)
# without creating a release.
#
# Cross-repo: stdlib is checked out at the ref in STDLIB_VERSION. Both repos
# are public now, so the default github.token can read the stdlib; the
# XIOM_CROSS_REPO_TOKEN fallback remains for orgs that keep it private.
#
# Release guard (CRB-4): a `guard` job runs before every build. On a tag
# push it FAILS when the tag does not equal the workspace crate version
# (Cargo.toml [workspace.package] version -- `xiom --version` reports that
# value, which is how the v0.60.1 archive ended up claiming v0.58.0) and
# when the tag is not an ancestor of main. On workflow_dispatch it only
# reads the version (dry runs keep working); the packaging steps label the
# artifacts with it.
#
# Docs publish (CRB-4b): after a release is created, the release job
# dispatches `compiler-release` to the docs repo (repository variable
# DOCS_REPO, default xiom-lang/website) with client_payload {tag,
# stdlib_ref, compiler_ref}. Requires secret XIOM_RELEASE_TOKEN to ALSO
# cover xiom-lang/website (Contents: read/write) or the dispatch 404s.
# Without the secret the step warns and skips; the release is not blocked.
#
# Bundle (CRB-3b): every archive ships all nine CLI tools (xiom, xiom-pkg,
# xiom-fmt, xiom-doc, xiom-lsp, xiom-dbg, xiom-mcp, xiom-verify, xiom-ffigen)
# plus the pinned Z3 solver next to them (bin/z3[.exe]) with the Z3 MIT
# license as LICENSE-Z3. The pin lives in tools/z3-pins.json (single version
# across platforms, SHA256 verified before extraction; Linux uses the oldest
# glibc build, floor 2.35). Staged-layout asserts run EVERY tool's
# `--version` (each tool self-reports the workspace version) and the bundled
# `z3 --version` before archiving.
#
# macOS jobs are gated on the repository variable RELEASE_BUILD_MACOS=true
# (macOS runner minutes bill 10x on private repos; enable once the repo is
# public or when a macOS release is actually needed):
#   gh variable set RELEASE_BUILD_MACOS --body true --repo xiom-lang/xiom

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version label (default: workspace version from Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: release guard (tag == workspace version, tag on main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout (full history for the ancestry check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read workspace version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["workspace"]["package"]["version"])
          PY
          )"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "workspace version: $ver"

      - name: Tag gate (tag == workspace version, tag is an ancestor of main)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="${{ steps.ver.outputs.version }}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::release tag v$tag does not match the workspace version $ver -- bump Cargo.toml [workspace.package] version in the release PR"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME is not an ancestor of main"
            exit 1
          fi
          echo "guard OK: v$tag == workspace $ver; tag is an ancestor of main"

  build:
    name: package ${{ matrix.platform }}
    needs: [guard]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
    steps:
      - name: Checkout xiom
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build release
        run: cargo build --release -p xiom -p xiom-pkg -p xiom-fmt -p xiom-doc -p xiom-lsp -p xiom-dbg -p xiom-mcp -p xiom-verify -p xiom-ffigen

      - name: Verify binaries
        shell: bash
        run: |
          for t in xiom xiom-pkg xiom-fmt xiom-doc xiom-lsp xiom-dbg xiom-mcp xiom-verify xiom-ffigen; do
            target/release/$t --version >/dev/null || { echo "::error::$t --version failed"; exit 1; }
          done

      - name: Bundle z3 (Windows, pinned + SHA256)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pins = Get-Content tools\z3-pins.json -Raw | ConvertFrom-Json
          $p = $pins.platforms.'windows-x64'
          New-Item -ItemType Directory -Force stage\bin | Out-Null
          $zip = Join-Path $env:TEMP 'xiom-z3.zip'
          Invoke-WebRequest -Uri $p.url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $p.sha256) { throw "z3 SHA256 mismatch: $actual" }
          $dir = Join-Path $env:TEMP 'xiom-z3'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir ($p.bin -replace '/','\')) (Join-Path 'stage' ($p.target -replace '/','\'))
          foreach ($f in $p.bundle) { Copy-Item (Join-Path $dir ($f -replace '/','\')) 'stage\bin\' }
          Copy-Item (Join-Path $dir $pins.license_file) 'stage\LICENSE-Z3'
          & 'stage\bin\z3.exe' --version

      - name: Bundle z3 (Linux/macOS, pinned + SHA256)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/z3pin.env
          import json
          pins = json.load(open("tools/z3-pins.json"))
          p = pins["platforms"]["${{ matrix.platform }}"]
          print("Z3_URL=" + p["url"])
          print("Z3_SHA=" + p["sha256"])
          print("Z3_BIN=" + p["bin"])
          print("Z3_TARGET=" + p["target"])
          print("Z3_FILES=" + " ".join(p.get("bundle", [])))
          print("Z3_LICENSE=" + pins["license_file"])
          PY
          . /tmp/z3pin.env
          curl -sSL "$Z3_URL" -o /tmp/xiom-z3.zip
          actual="$(shasum -a 256 /tmp/xiom-z3.zip | awk '{print $1}')"
          [ "$actual" = "$Z3_SHA" ] || { echo "::error::z3 SHA256 mismatch: $actual"; exit 1; }
          rm -rf /tmp/xiom-z3 && mkdir -p /tmp/xiom-z3
          unzip -q /tmp/xiom-z3.zip -d /tmp/xiom-z3
          mkdir -p stage/bin
          cp "/tmp/xiom-z3/$Z3_BIN" "stage/$Z3_TARGET"
          for f in $Z3_FILES; do cp "/tmp/xiom-z3/$f" stage/bin/; done
          cp "/tmp/xiom-z3/$Z3_LICENSE" stage/LICENSE-Z3
          "stage/$Z3_TARGET" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # CRB-4: tag builds carry the guard-verified workspace version
          # (equal to the tag); dry runs use the dispatch label or, when
          # empty, the workspace version.
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || needs.guard.outputs.version }}
        run: |
          $ver = $env:RELEASE_VERSION -replace '^v', ''
          $stage = 'stage'
          $tools = 'xiom','xiom-pkg','xiom-fmt','xiom-doc','xiom-lsp','xiom-dbg','xiom-mcp','xiom-verify','xiom-ffigen'
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/lib" | Out-Null
          foreach ($t in $tools) { Copy-Item "target\release\$t.exe" "$stage/bin/" }
          Copy-Item stdlib\xiom "$stage/lib/xiom" -Recurse
          Copy-Item stdlib\runtime "$stage/lib/runtime" -Recurse
          Copy-Item stdlib\package.xi "$stage/lib/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, README.md $stage
          # CRB-3b: every staged tool (and the bundled solver) must run and
          # self-report the packaged version before the archive is sealed.
          foreach ($t in $tools) {
            $out = & "$stage/bin/$t.exe" --version 2>&1 | Out-String
            $code = $LASTEXITCODE
            if ($code -ne 0 -or $out -notmatch [regex]::Escape("v$ver")) { throw "$t --version does not report v$ver (exit $code): $out" }
          }
          $z3Out = & "$stage/bin/z3.exe" --version 2>&1 | Out-String
          if ($z3Out -notmatch 'Z3 version') { throw "staged z3 does not run: $z3Out" }
          $name = "xiom-$ver-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content SHA256SUMS-windows-x64 -Encoding ASCII
          "ARTIFACT_NAME=$name" | Out-File -Append $env:GITHUB_ENV -Encoding ASCII

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || needs.guard.outputs.version }}
        run: |
          ver="${RELEASE_VERSION#v}"
          mkdir -p stage/bin stage/lib
          for t in xiom xiom-pkg xiom-fmt xiom-doc xiom-lsp xiom-dbg xiom-mcp xiom-verify xiom-ffigen; do
            cp "target/release/$t" stage/bin/
          done
          cp -r stdlib/xiom stage/lib/xiom
          cp -r stdlib/runtime stage/lib/runtime
          cp stdlib/package.xi stage/lib/
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md stage/
          # CRB-3b: every staged tool (and the bundled solver) must run and
          # self-report the packaged version before the archive is sealed.
          for t in xiom xiom-pkg xiom-fmt xiom-doc xiom-lsp xiom-dbg xiom-mcp xiom-verify xiom-ffigen; do
            out="$(stage/bin/$t --version 2>&1)"
            case "$out" in *"v$ver"*) ;; *) echo "::error::$t --version does not report v$ver: $out"; exit 1;; esac
          done
          z3_out="$(stage/bin/z3 --version 2>&1)"
          case "$z3_out" in *"Z3 version"*) ;; *) echo "::error::staged z3 does not run: $z3_out"; exit 1;; esac
          name="xiom-$ver-linux-x64.tar.gz"
          tar -czf "$name" -C stage .
          sha256sum "$name" > SHA256SUMS-linux-x64
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiom-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            SHA256SUMS-*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

  build-macos:
    name: package ${{ matrix.platform }}
    if: vars.RELEASE_BUILD_MACOS == 'true'
    needs: [guard]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            os: macos-13
          - platform: macos-arm64
            os: macos-14
    steps:
      - name: Checkout xiom
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.platform }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build release
        run: cargo build --release -p xiom -p xiom-pkg -p xiom-fmt -p xiom-doc -p xiom-lsp -p xiom-dbg -p xiom-mcp -p xiom-verify -p xiom-ffigen

      - name: Bundle z3 (macOS, pinned + SHA256)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/z3pin.env
          import json
          pins = json.load(open("tools/z3-pins.json"))
          p = pins["platforms"]["${{ matrix.platform }}"]
          print("Z3_URL=" + p["url"])
          print("Z3_SHA=" + p["sha256"])
          print("Z3_BIN=" + p["bin"])
          print("Z3_TARGET=" + p["target"])
          print("Z3_FILES=" + " ".join(p.get("bundle", [])))
          print("Z3_LICENSE=" + pins["license_file"])
          PY
          . /tmp/z3pin.env
          curl -sSL "$Z3_URL" -o /tmp/xiom-z3.zip
          actual="$(shasum -a 256 /tmp/xiom-z3.zip | awk '{print $1}')"
          [ "$actual" = "$Z3_SHA" ] || { echo "::error::z3 SHA256 mismatch: $actual"; exit 1; }
          rm -rf /tmp/xiom-z3 && mkdir -p /tmp/xiom-z3
          unzip -q /tmp/xiom-z3.zip -d /tmp/xiom-z3
          mkdir -p stage/bin
          cp "/tmp/xiom-z3/$Z3_BIN" "stage/$Z3_TARGET"
          for f in $Z3_FILES; do cp "/tmp/xiom-z3/$f" stage/bin/; done
          cp "/tmp/xiom-z3/$Z3_LICENSE" stage/LICENSE-Z3
          "stage/$Z3_TARGET" --version

      - name: Package (macOS)
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || needs.guard.outputs.version }}
        run: |
          ver="${RELEASE_VERSION#v}"
          mkdir -p stage/bin stage/lib
          for t in xiom xiom-pkg xiom-fmt xiom-doc xiom-lsp xiom-dbg xiom-mcp xiom-verify xiom-ffigen; do
            cp "target/release/$t" stage/bin/
          done
          cp -r stdlib/xiom stage/lib/xiom
          cp -r stdlib/runtime stage/lib/runtime
          cp stdlib/package.xi stage/lib/
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md stage/
          # CRB-3b: every staged tool (and the bundled solver) must run and
          # self-report the packaged version before the archive is sealed.
          for t in xiom xiom-pkg xiom-fmt xiom-doc xiom-lsp xiom-dbg xiom-mcp xiom-verify xiom-ffigen; do
            out="$(stage/bin/$t --version 2>&1)"
            case "$out" in *"v$ver"*) ;; *) echo "::error::$t --version does not report v$ver: $out"; exit 1;; esac
          done
          z3_out="$(stage/bin/z3 --version 2>&1)"
          case "$z3_out" in *"Z3 version"*) ;; *) echo "::error::staged z3 does not run: $z3_out"; exit 1;; esac
          name="xiom-$ver-${{ matrix.platform }}.tar.gz"
          tar -czf "$name" -C stage .
          shasum -a 256 "$name" > "SHA256SUMS-${{ matrix.platform }}"
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiom-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            SHA256SUMS-*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (version + stdlib pin for the docs payload)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: xiom-src

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd artifacts
          cat SHA256SUMS-* > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Token check (diagnostic; shows token type and scopes only)
        env:
          GH_TOKEN: ${{ secrets.XIOM_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Create release
        env:
          # XIOM_RELEASE_TOKEN (fine-grained PAT, Contents: read/write on this
          # repo) is the fallback for organizations that pin the default
          # GITHUB_TOKEN to read-only. Prefer it over raising the org default.
          GH_TOKEN: ${{ secrets.XIOM_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          FILES=$(ls *.zip *.tar.gz 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" $FILES SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: "Notify docs (repository_dispatch: compiler-release)"
        env:
          # CRB-4b: the docs publish workflow lives in xiom-lang/website and
          # listens for `compiler-release`. XIOM_RELEASE_TOKEN must ALSO cover
          # that repo (fine-grained: Contents read/write) or the dispatch
          # 404s; the default GITHUB_TOKEN cannot dispatch cross-repo.
          GH_TOKEN: ${{ secrets.XIOM_RELEASE_TOKEN }}
          DOCS_REPO: ${{ vars.DOCS_REPO || 'xiom-lang/website' }}
          TAG: ${{ github.ref_name }}
          # The website workflow checks this ref out; the tag is the
          # checkout-able release ref (an ancestor of main, guard-verified).
          COMPILER_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::XIOM_RELEASE_TOKEN is not set -- docs will not be published for $TAG (extend the PAT to $DOCS_REPO per the release workflow header)"
            exit 0
          fi
          stdlib_ref="$(tr -d '\r\n ' < xiom-src/STDLIB_VERSION)"
          gh api "repos/$DOCS_REPO/dispatches" \
            -f event_type=compiler-release \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[stdlib_ref]=$stdlib_ref" \
            -f "client_payload[compiler_ref]=$COMPILER_REF"
          echo "dispatched compiler-release to $DOCS_REPO (tag=$TAG stdlib_ref=$stdlib_ref compiler_ref=$COMPILER_REF)"
