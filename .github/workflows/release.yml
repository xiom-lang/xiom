name: XIOM Release

# Tag push (v*) publishes a GitHub Release with packaged toolchains.
# Manual dispatch builds the same packages as workflow artifacts (dry run)
# without creating a release.
#
# Cross-repo: stdlib is checked out at the ref in STDLIB_VERSION using
# secrets.XIOM_CROSS_REPO_TOKEN (fine-grained PAT with Contents: read on
# xiom-lang/stdlib). Without the secret the fallback github.token cannot
# read another private repository and the job fails loudly.
#
# Version gate: a tag push MUST match the workspace crate version
# (Cargo.toml [workspace.package] version); `xiom --version` reports that
# value, so a mismatched tag produces a release whose archive lies about
# its version (the v0.60.1 archive reported v0.58.0). The build job fails
# before packaging on any mismatch.
#
# Docs publish: after a release is created, the release job dispatches
# `compiler-release` to the docs repo (repository variable DOCS_REPO,
# default xiom-lang/website) with client_payload {tag, stdlib_ref,
# compiler_ref}. Requires secret XIOM_DOCS_DISPATCH_TOKEN (fine-grained
# PAT, Contents: read/write on the docs repo -- classic PAT: repo scope).
# Without the secret the step warns and skips; the release itself is not
# blocked.
#
# macOS jobs are gated on the repository variable RELEASE_BUILD_MACOS=true
# (macOS runner minutes bill 10x on private repos; enable once the repo is
# public or when a macOS release is actually needed):
#   gh variable set RELEASE_BUILD_MACOS --body true --repo xiom-lang/xiom

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version label (no release is created)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
    steps:
      - name: Checkout xiom
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version gate (tag == crate version)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$crate" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          if [ "$tag" != "$crate" ]; then
            echo "::error::release tag v$tag does not match the workspace crate version $crate -- bump [workspace.package] version or retag; xiom --version would report v$crate"
            exit 1
          fi
          echo "version gate OK: v$tag == workspace $crate"

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Verify binary
        shell: bash
        run: target/release/xiom --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $ver = $env:RELEASE_VERSION -replace '^v', ''
          $stage = 'stage'
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/lib" | Out-Null
          Copy-Item target\release\xiom.exe "$stage/bin/"
          Copy-Item stdlib\xiom "$stage/lib/xiom" -Recurse
          Copy-Item stdlib\runtime "$stage/lib/runtime" -Recurse
          Copy-Item stdlib\package.xi "$stage/lib/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, README.md $stage
          $name = "xiom-$ver-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content SHA256SUMS-windows-x64 -Encoding ASCII
          "ARTIFACT_NAME=$name" | Out-File -Append $env:GITHUB_ENV -Encoding ASCII

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          ver="${RELEASE_VERSION#v}"
          mkdir -p stage/bin stage/lib
          cp target/release/xiom stage/bin/
          cp -r stdlib/xiom stage/lib/xiom
          cp -r stdlib/runtime stage/lib/runtime
          cp stdlib/package.xi stage/lib/
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md stage/
          name="xiom-$ver-linux-x64.tar.gz"
          tar -czf "$name" -C stage .
          sha256sum "$name" > SHA256SUMS-linux-x64
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiom-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            SHA256SUMS-*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

  build-macos:
    name: package ${{ matrix.platform }}
    if: vars.RELEASE_BUILD_MACOS == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            os: macos-13
          - platform: macos-arm64
            os: macos-14
    steps:
      - name: Checkout xiom
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.platform }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Package (macOS)
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          ver="${RELEASE_VERSION#v}"
          mkdir -p stage/bin stage/lib
          cp target/release/xiom stage/bin/
          cp -r stdlib/xiom stage/lib/xiom
          cp -r stdlib/runtime stage/lib/runtime
          cp stdlib/package.xi stage/lib/
          cp LICENSE-MIT LICENSE-APACHE NOTICE README.md stage/
          name="xiom-$ver-${{ matrix.platform }}.tar.gz"
          tar -czf "$name" -C stage .
          shasum -a 256 "$name" > "SHA256SUMS-${{ matrix.platform }}"
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiom-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            SHA256SUMS-*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.ARTIFACT_NAME }}

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (version + stdlib pin for the docs payload)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: xiom-src

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd artifacts
          cat SHA256SUMS-* > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Token check (diagnostic; shows token type and scopes only)
        env:
          GH_TOKEN: ${{ secrets.XIOM_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Create release
        env:
          # XIOM_RELEASE_TOKEN (fine-grained PAT, Contents: read/write on this
          # repo) is the fallback for organizations that pin the default
          # GITHUB_TOKEN to read-only. Prefer it over raising the org default.
          GH_TOKEN: ${{ secrets.XIOM_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          FILES=$(ls *.zip *.tar.gz 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" $FILES SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: "Notify docs (repository_dispatch: compiler-release)"
        env:
          # The docs (publish) workflow lives in the docs/website repo and
          # listens for `compiler-release`. Needs a PAT with Contents:
          # read/write on that repo (classic: repo scope) -- the default
          # GITHUB_TOKEN cannot dispatch to another repository.
          GH_TOKEN: ${{ secrets.XIOM_DOCS_DISPATCH_TOKEN }}
          DOCS_REPO: ${{ vars.DOCS_REPO || 'xiom-lang/website' }}
          TAG: ${{ github.ref_name }}
          COMPILER_REF: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::XIOM_DOCS_DISPATCH_TOKEN is not set -- docs will not be published for $TAG (provision the token per the release workflow header)"
            exit 0
          fi
          stdlib_ref="$(tr -d '\r\n ' < xiom-src/STDLIB_VERSION)"
          gh api "repos/$DOCS_REPO/dispatches" \
            -f event_type=compiler-release \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[stdlib_ref]=$stdlib_ref" \
            -f "client_payload[compiler_ref]=$COMPILER_REF"
          echo "dispatched compiler-release to $DOCS_REPO (tag=$TAG stdlib_ref=$stdlib_ref compiler_ref=$COMPILER_REF)"
