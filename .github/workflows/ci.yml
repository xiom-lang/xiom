name: XIOM CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Run E2E tests
        run: cargo test -p xiom-codegen --test e2e_tests -- e2e_p0 e2e_p1 e2e_p2 e2e_never_type e2e_asm e2e_spawn_basic e2e_i2

      - name: Verify binary
        run: target/release/xiom --version
        shell: bash

      - name: Compile + run XIOM smoke test
        run: |
          echo 'fn main() -> Int { return 0; }' > /tmp/smoke.xi
          target/release/xiom /tmp/smoke.xi -o /tmp/smoke_test
          /tmp/smoke_test
        shell: bash
