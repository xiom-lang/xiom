name: XIOM CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: workspace hygiene (all targets, MSRV 1.86, cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"

      # `cargo check --workspace --all-targets` builds every workspace member
      # INCLUDING binaries and test targets -- the per-package release build
      # below does not, which let xiom-mcp rot after a CompileConfig field
      # was added (E0063, fixed in round 44).
      - name: Workspace check (MSRV, bins + tests, no run)
        run: cargo check --workspace --all-targets

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Supply-chain gate (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encoding guard (no mojibake / non-ASCII in tracked text files)
        run: python tools/ascii_guard.py check
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Compiler robustness + fuzz-regression suites
        run: |
          cargo test -p xiom-codegen --test fuzz_tests
          cargo test -p xiom-codegen --test robustness_tests

      - name: Compiler performance budgets (IR bytes + determinism)
        run: cargo test -p xiom-codegen --test perf_budget_tests

      - name: Tooling unit tests (bin-only crates)
        run: cargo test -p xiom-pkg -p xiom-dbg -p xiom-lsp -p xiom-mcp

      - name: Run E2E tests
        run: |
          cargo test -p xiom-codegen --test e2e_tests -- e2e_p0 e2e_p1 e2e_p2 e2e_never_type e2e_asm e2e_spawn_basic e2e_i2
          cargo test -p xiom-codegen --test e2e_tests -- e2e_m74_user_alias_shadows_catalog e2e_m75_alias_delegation e2e_m76_contract_payload_param_len e2e_m77_ptr_plus_int_arg e2e_m78_user_sameleaf_modules
        shell: bash

      - name: Verify binary
        run: target/release/xiom --version
        shell: bash

      - name: Compile + run XIOM smoke test
        run: |
          echo 'fn main() -> Int { return 0; }' > /tmp/smoke.xi
          target/release/xiom /tmp/smoke.xi -o /tmp/smoke_test
          /tmp/smoke_test
        shell: bash

  # Audit gap: "toy LCG fuzzers; no coverage/ASAN/fuzz CI gates". The fuzz/
  # directory is a standalone cargo-fuzz workspace (libfuzzer-sys is kept out
  # of the root workspace on purpose). Linux links Rust's ASAN statically, so
  # the coverage runs below carry address+undefined instrumentation.
  fuzz-smoke:
    name: fuzz smoke (cargo-fuzz, 30s/target, ASAN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Build fuzz targets
        run: cargo +nightly fuzz build

      - name: Fuzz lexer
        run: cargo +nightly fuzz run lexer -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz parser
        run: cargo +nightly fuzz run parser -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz ctfe
        run: cargo +nightly fuzz run ctfe -- -max_total_time=30 -rss_limit_mb=2048

      - name: Fuzz pipeline
        run: cargo +nightly fuzz run pipeline -- -max_total_time=30 -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Compiler-side sanitizer wiring (`--sanitize=address`) must actually
  # produce a runnable, clean-boot instrumented binary.
  sanitizer-smoke:
    name: sanitizer smoke (--sanitize=address)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build compiler
        run: cargo build -p xiom

      - name: Compile + run an ASAN-instrumented program
        run: |
          cat > /tmp/asan_smoke.xi <<'EOF'
          fn sieve(n: Int) -> Int {
            var count = 0;
            var i = 2;
            while i < n {
              var is_prime = true;
              var d = 2;
              while d * d <= i {
                if i - (i / d) * d == 0 { is_prime = false; }
                d = d + 1;
              }
              if is_prime { count = count + 1; }
              i = i + 1;
            }
            return count;
          }
          fn main() -> Int {
            if sieve(50) != 15 { return 1; }
            return 0;
          }
          EOF
          target/debug/xiom /tmp/asan_smoke.xi --sanitize=address -o /tmp/asan_smoke
          ASAN_OPTIONS=detect_leaks=0 /tmp/asan_smoke
        shell: bash

      - name: Contracts under ASAN (runtime checker path)
        run: |
          cat > /tmp/asan_contract.xi <<'EOF'
          fn inc(n: Int) -> Int
            requires: n >= 0
            ensures: result == n + 1
          {
            return n + 1;
          }
          fn main() -> Int {
            return inc(41) - 42;
          }
          EOF
          target/debug/xiom /tmp/asan_contract.xi --sanitize=address -o /tmp/asan_contract
          ASAN_OPTIONS=detect_leaks=0 /tmp/asan_contract
        shell: bash
