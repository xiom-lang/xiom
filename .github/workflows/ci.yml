name: XIOM CI

# Tier 1 CI: every pull request + manual dispatch. Deliberately scoped to
# keep private-repo minutes sustainable (Windows bills 2x, macOS 10x on
# private repos):
#   - heavy suites (fuzz smoke, sanitizer) live in heavy.yml (weekly +
#     dispatch)
#   - macOS builds live in release.yml, gated by the RELEASE_BUILD_MACOS
#     repository variable
#   - full e2e and the stdlib suites run locally / on tags (see docs/SESSION.md)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: workspace hygiene (all targets, MSRV 1.86, cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.86.0"

      # `cargo check --workspace --all-targets` builds every workspace member
      # INCLUDING binaries and test targets -- the per-package release build
      # below does not, which let xiom-mcp rot after a CompileConfig field
      # was added (E0063, fixed in round 44).
      - name: Workspace check (MSRV, bins + tests, no run)
        run: cargo check --workspace --all-targets

      - name: Install cargo-deny
        uses: taiki-e/install-action@20dbe8975311291f4d8dc8bbf4c4dd67b25920d5 # cargo-deny

      - name: Supply-chain gate (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Missing stdlib checkout must fail CI, never silently skip (R31).
      XIOM_REQUIRE_STDLIB: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      # Needs org secret XIOM_CROSS_REPO_TOKEN (fine-grained PAT, Contents:
      # read on xiom-lang/stdlib); github.token cannot read another private
      # repository. See docs/REPO_MIGRATION_RUNBOOK.md.
      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Encoding guard (no mojibake / non-ASCII in tracked text files)
        run: python tools/ascii_guard.py check
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Compiler robustness + fuzz-regression suites
        run: |
          cargo test -p xiom-codegen --test fuzz_tests
          cargo test -p xiom-codegen --test robustness_tests

      - name: Compiler performance budgets (IR bytes + determinism)
        run: cargo test -p xiom-codegen --test perf_budget_tests

      - name: Tooling unit tests (bin-only crates)
        run: cargo test -p xiom-pkg -p xiom-dbg -p xiom-lsp -p xiom-mcp

      - name: Run E2E tests
        run: |
          cargo test -p xiom-codegen --test e2e_tests -- e2e_p0 e2e_p1 e2e_p2 e2e_never_type e2e_asm e2e_spawn_basic e2e_i2
          cargo test -p xiom-codegen --test e2e_tests -- e2e_m74_user_alias_shadows_catalog e2e_m75_alias_delegation e2e_m76_contract_payload_param_len e2e_m77_ptr_plus_int_arg e2e_m78_user_sameleaf_modules e2e_m84_type_same_leaf_modules e2e_m85_clone_ref_receiver e2e_m86_ref_of_reference
        shell: bash

      - name: Verify binary
        run: target/release/xiom --version
        shell: bash

      - name: Compile + run XIOM smoke test
        run: |
          echo 'fn main() -> Int { return 0; }' > /tmp/smoke.xi
          target/release/xiom /tmp/smoke.xi -o /tmp/smoke_test
          /tmp/smoke_test
        shell: bash
