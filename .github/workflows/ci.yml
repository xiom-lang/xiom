name: XIOM CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM/clang
        run: choco install llvm -y
      - name: Build
        run: cargo build --workspace --release
      - name: Test compiler
        run: cargo test --workspace -- --test-threads=2
      - name: Verify version
        run: .\target\release\xiom.exe --version

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM/clang
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev clang-18 libclang-18-dev
      - name: Build
        run: cargo build --workspace --release
      - name: Test compiler
        run: cargo test --workspace -- --test-threads=2
      - name: Verify version
        run: ./target/release/xiom --version

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM/clang
        run: brew install llvm@18
      - name: Build
        run: cargo build --workspace --release
        env:
          LLVM_SYS_180_PREFIX: /usr/local/opt/llvm@18
      - name: Test compiler
        run: cargo test --workspace -- --test-threads=2
        env:
          LLVM_SYS_180_PREFIX: /usr/local/opt/llvm@18
      - name: Verify version
        run: ./target/release/xiom --version
        env:
          LLVM_SYS_180_PREFIX: /usr/local/opt/llvm@18

  release:
    needs: [test-windows, test-linux, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
