name: XIOM CI

# Tier 1 CI: every pull request + manual dispatch. Deliberately scoped to
# keep private-repo minutes sustainable (Windows bills 2x, macOS 10x on
# private repos):
#   - heavy suites (fuzz smoke, sanitizer) live in heavy.yml (weekly +
#     dispatch)
#   - macOS builds live in release.yml, gated by the RELEASE_BUILD_MACOS
#     repository variable
#   - full e2e and the stdlib suites run locally / on tags (see docs/SESSION.md)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: workspace hygiene (all targets, MSRV 1.86, cargo-deny, cargo-vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.86.0"

      # `cargo check --workspace --all-targets` builds every workspace member
      # INCLUDING binaries and test targets -- the per-package release build
      # below does not, which let xiom-mcp rot after a CompileConfig field
      # was added (E0063, fixed in round 44).
      - name: Workspace check (MSRV, bins + tests, no run)
        run: cargo check --workspace --all-targets

      - name: Install cargo-deny
        uses: taiki-e/install-action@20dbe8975311291f4d8dc8bbf4c4dd67b25920d5 # cargo-deny

      - name: Supply-chain gate (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

      - name: Install cargo-vet
        uses: taiki-e/install-action@20dbe8975311291f4d8dc8bbf4c4dd67b25920d5 # install-action
        with:
          tool: cargo-vet

      # The committed supply-chain/config.toml exempts the CURRENT dependency
      # tree (171 crates, cargo-vet 0.10.2). Any new dependency or version
      # bump is unvetted and fails here until it is audited or explicitly
      # exempted -- the supply-chain regression gate for the registry work.
      - name: "Supply-chain gate (cargo-vet: audited or explicitly exempted)"
        run: cargo vet

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Missing stdlib checkout must fail CI, never silently skip (R31).
      XIOM_REQUIRE_STDLIB: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read STDLIB_VERSION
        id: pin
        shell: bash
        run: echo "ref=$(tr -d '\r\n ' < STDLIB_VERSION)" >> "$GITHUB_OUTPUT"

      # Needs org secret XIOM_CROSS_REPO_TOKEN (fine-grained PAT, Contents:
      # read on xiom-lang/stdlib); github.token cannot read another private
      # repository. See docs/REPO_MIGRATION_RUNBOOK.md.
      - name: Checkout stdlib at the pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xiom-lang/stdlib
          ref: ${{ steps.pin.outputs.ref }}
          path: stdlib
          token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Encoding guard (no mojibake / non-ASCII in tracked text files)
        run: python tools/ascii_guard.py check
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release -p xiom

      - name: Run unit tests
        run: cargo test --workspace --lib

      - name: Release-notes converter/validator tests
        run: cargo test -p xiom-release-notes

      - name: Compiler robustness + fuzz-regression suites
        run: |
          cargo test -p xiom-codegen --test fuzz_tests
          cargo test -p xiom-codegen --test robustness_tests

      - name: Compiler performance budgets (IR bytes + determinism)
        run: cargo test -p xiom-codegen --test perf_budget_tests

      # m125: the freeze snapshot drifted silently against the pinned stdlib
      # (Executor -> AsyncExecutor, HttpResponse -> NetHttpResponse) and the
      # gate was not on the CI path. It is cheap and now guards renames.
      - name: Stdlib API freeze (no removals, all modules compile)
        run: cargo test -p xiom-codegen --test stdlib_api_freeze_tests

      # FE-1..FE-7 + Sprint C + relay locks: the shared toolchain probe +
      # doctor v2 report, the E001 conservatism locks and the checker locks
      # (clause Bool-mix rejection, private same-leaf triage). Unit tests ride
      # the workspace --lib step above; these run the built binary.
      - name: Front-end CLI + borrow + checker locks
        run: cargo test -p xiom --test doctor_cli --test borrow_e001 --test checker_locks --test run_script_cli

      - name: Tooling unit tests (bin-only crates)
        run: cargo test -p xiom-pkg -p xiom-dbg -p xiom-lsp -p xiom-mcp

      - name: Run E2E tests
        run: |
          cargo test -p xiom-codegen --test e2e_tests -- e2e_p0 e2e_p1 e2e_p2 e2e_never_type e2e_asm e2e_spawn_basic e2e_i2
          cargo test -p xiom-codegen --test e2e_tests -- e2e_m74_user_alias_shadows_catalog e2e_m75_alias_delegation e2e_m76_contract_payload_param_len e2e_m77_ptr_plus_int_arg e2e_m78_user_sameleaf_modules e2e_m84_type_same_leaf_modules e2e_m85_clone_ref_receiver e2e_m86_ref_of_reference e2e_m87_tuple_element_types e2e_m88_generic_same_leaf_boxes e2e_m89_struct_variant_node e2e_m90_stdlib_same_leaf_http e2e_m91_conversion_methods e2e_m92_interface_dispatch_zero_init e2e_m93_interface_generic_inference e2e_m94_nested_vec_struct_elem e2e_m95_pre_call_capture e2e_m96_array_str_elem e2e_m97_enum_variant_match e2e_m98_match_str_to_string e2e_m99_module_path_alias e2e_m100_result_payload_contract e2e_m101_pre_len_receivers e2e_m102_range_shadowing e2e_m103_pre_len_param e2e_m104_pre_capture_callee e2e_m105_unqualified_assert e2e_m106_generic_field_str e2e_m107_match_payload_str e2e_m108_explicit_self_and_map e2e_m109_large_fixed_array e2e_m110_generic_factory_evidence e2e_m111_map_vec_container_payload e2e_m112_try_result_tuple e2e_m113_map_str_str_morse e2e_m114_result_tuple_vec_loop e2e_m115_ref_tuple_mangle e2e_m116_generic_ctor_field_index e2e_m117_interface_value_abi_rejected e2e_m118_env_platform_constants e2e_m119_contract_method_values e2e_m120_ctor_user_struct_return e2e_m121_nested_extern e2e_m122_generic_param_type e2e_m123_for_in_collections e2e_m124_contract_all_none e2e_m127_fn_vec_indexed_calls e2e_m129_module_trailing_semicolon e2e_m130_fn_value_abi e2e_m131_generic_fn_callback_abi e2e_m132_e001_consumed_borrow e2e_m134_private_same_leaf e2e_m136_well_typed_clauses e2e_m138_u8_const_widen e2e_m140_result_payload_ref e2e_m142_ptr_isnull_ufcs e2e_m143_receiver_container_mutation e2e_m144_sibling_method_calls e2e_m145_shift_precedence e2e_m146_signed_extern_result e2e_m148_match_payload_alias e2e_m150_exact_arity e2e_m152_mut_write_through e2e_m153_parse_int_trim_isempty e2e_m150_dl_num_catalog_abs e2e_m150_dl_num_parse e2e_m163_method_field_vec_concat e2e_m164_const_table_global e2e_m162_sameleaf_catalog_poison e2e_m165_vec_byte_buffer_gt_16mb e2e_m168_mut_ref_write_through e2e_m167_global_vec_push e2e_m169_sameleaf_qualified_result_elem e2e_m169_sameleaf_result_elem_read_ir e2e_m170_fn_typed_vec_return e2e_m170_fn_typed_vec_return_ir e2e_m168_mut_ref_byval_arg e2e_m168_mut_ref_byval_arg_ir e2e_c23_l6_category e2e_c23_l7_pending e2e_c23_l8_quick e2e_m173_enum_eq_scalar_payload e2e_m174_struct_literal_field_order e2e_m175_read_line_piped_stdin e2e_m175_stdin_handle_inttoptr_ir e2e_m176_qualified_struct_literal e2e_m179_arc_strong_count e2e_m180_contracts_any_av e2e_m182_const_tables e2e_m184_nested_module_import e2e_m185_uninit_local_struct e2e_m186_uint32_high_bit_compare e2e_m188_const_match_arms e2e_m21_type_edge_010 e2e_m21_type_edge_011 e2e_m32_e15 e2e_m36_c09 e2e_m65_vec_option_elem
        shell: bash

      - name: Verify binary
        run: target/release/xiom --version
        shell: bash

      - name: Compile + run XIOM smoke test
        run: |
          echo 'fn main() -> Int { return 0; }' > /tmp/smoke.xi
          target/release/xiom /tmp/smoke.xi -o /tmp/smoke_test
          /tmp/smoke_test
        shell: bash
